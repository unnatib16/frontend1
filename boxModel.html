<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Example</title>
  <style>
    .box {
      width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="box box1">
    <p>This is Box 1</p>
  </div>

  <div class="box box2">
    <p>This is Box 2</p>
  </div>

</body>
</html>
