<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <label>First Name : </label>
    <input type="text" placeholder="first-name" class="name" required>
    <br><br>
    <label>Last Name : </label>
    <input type="text" placeholder="last-name" class="name" required>
    <br><br>
    <label>Email : </label>
    <input type="email" placeholder="email" id="email" required>
    <br><br>
    <label>Age : </label>
    <input type="age" placeholder="age" id="age" required>
    <br><br>
    <h1>Gender:</h1>
    <input type="radio" value="Male" name="gender">
    <label>Male</label>
    <input type="radio" value="Female" name="gender">
    <label>Female</label>
    <input type="radio" value="Other" name="gender">
    <label>Others</label>
    <H1>Select Programming Language</H1>
    <select name="lang">
        <option value="js">Javascript</option>
        <option value="py">Python</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
    </select>
    <h1>Select environment : </h1>
    <input type="checkbox" value="Office" name="env">
    <label>Office</label>
    <input type="checkbox" value="Remote" name="env">
    <label>Remote</label>
    <input type="checkbox" value="Hybrid" name="env">
    <label>Hybrid</label>
    <br><br>
    <button type="submit">Register</button>
    </form>
</body>
</html>
